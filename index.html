<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>roll</title>
    <script>
      // The system decides light or dark, before the first paint.
      if (!matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.replace("dark", "light");
      document.documentElement.style.colorScheme = document.documentElement.classList.contains("light") ? "light" : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
